<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ADXé Café — Historial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#0f172a;font-size:15px;}
.hdr{background:#0f172a;padding:18px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between;position:sticky;top:0;z-index:100;}
.hdr h1{font-size:22px;font-weight:500;color:#f1f5f9;letter-spacing:-0.5px;}
.hdr-sub{font-size:11px;color:#64748b;margin-top:3px;}
.hdr-badge{background:#1e3a5f;color:#93c5fd;font-size:10px;font-weight:500;padding:5px 10px;border-radius:20px;}
.loading{padding:60px 24px;text-align:center;color:#64748b;font-size:14px;}
.vacio{padding:60px 24px;text-align:center;}
.vacio h2{font-size:20px;font-weight:500;margin-bottom:10px;}
.vacio p{color:#64748b;font-size:14px;line-height:1.6;}
.semana{margin:12px 12px 0;border-radius:12px;overflow:hidden;border:0.5px solid #e2e8f0;background:white;margin-bottom:2px;}
.semana-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:white;}
.semana-titulo{font-size:15px;font-weight:500;color:#0f172a;}
.semana-meta{font-size:11px;color:#64748b;margin-top:2px;}
.semana-chevron{font-size:12px;color:#94a3b8;transition:transform .2s;}
.semana-header.collapsed .semana-chevron{transform:rotate(-90deg);}
.semana-body{border-top:0.5px solid #f1f5f9;padding-bottom:8px;}
.semana-body.hidden{display:none;}
.compra-card{margin:10px 12px;border-radius:10px;border:0.5px solid #e2e8f0;overflow:hidden;}
.compra-header{padding:10px 14px;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;}
.compra-fecha{font-size:13px;font-weight:500;color:#0f172a;}
.compra-stats{display:flex;gap:8px;}
.stat{font-size:10px;font-weight:500;padding:2px 8px;border-radius:10px;}
.stat.ok{background:#dcfce7;color:#166534;}
.stat.nf{background:#fee2e2;color:#991b1b;}
.compra-sec{font-size:10px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#94a3b8;padding:8px 14px 3px;}
.compra-item{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;border-bottom:0.5px solid #f8fafc;}
.compra-item:last-child{border-bottom:none;}
.ci-nombre{font-size:13px;color:#0f172a;}
.ci-tienda{font-size:10px;color:#94a3b8;}
.ci-badge{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:500;flex-shrink:0;}
.ci-badge.ok{background:#dcfce7;color:#166534;}
.ci-badge.nf{background:#fee2e2;color:#991b1b;}
.compra-notas{margin:8px 14px;padding:10px 12px;background:#fffbeb;border-radius:8px;border:0.5px solid #fde68a;font-size:12px;color:#92400e;line-height:1.5;}
.compra-notas strong{display:block;margin-bottom:3px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
.lista-sec{font-size:10px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#94a3b8;padding:8px 14px 3px;background:#f0f9ff;}
.lista-item{font-size:13px;padding:6px 14px;border-bottom:0.5px solid #f8fafc;color:#0f172a;}
.lista-item:last-child{border-bottom:none;}
.lista-det{font-size:10px;color:#94a3b8;}
.tab-bar{background:#0f172a;padding:0 14px 14px;display:flex;gap:8px;}
.tbar-btn{font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px;color:#64748b;cursor:pointer;border:none;background:transparent;font-family:inherit;}
.tbar-btn.on{background:#1e3a5f;color:#93c5fd;}
</style>
</head>
<body>
<div class="hdr">
  <div><h1>Historial</h1><div class="hdr-sub">Últimas 3 semanas</div></div>
  <div class="hdr-badge">ADXé Café</div>
</div>
<div class="tab-bar">
  <button class="tbar-btn on" id="tab-compras" onclick="cambiarVista('compras')">Compras</button>
  <button class="tbar-btn" id="tab-revisiones" onclick="cambiarVista('revisiones')">Revisiones</button>
</div>
<div id="contenido"><div class="loading">Cargando historial...</div></div>

<script>
var FIREBASE_URL='https://adxe-cafe-9d085-default-rtdb.firebaseio.com';
var vistaActual='compras';
var dataCompras={};
var dataRevisiones={};
var cargado=false;

var DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function formatFecha(iso){
  var d=new Date(iso);
  return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]+' '+d.getFullYear();
}

function formatHora(iso){
  var d=new Date(iso);
  return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}

function semanaLabel(fecha){
  var d=new Date(fecha);
  var lunes=new Date(d);lunes.setDate(d.getDate()-((d.getDay()+6)%7));
  var domingo=new Date(lunes);domingo.setDate(lunes.getDate()+6);
  return 'Semana del '+lunes.getDate()+' al '+domingo.getDate()+' de '+MESES[domingo.getMonth()];
}

function esUltimas3Semanas(iso){
  var d=new Date(iso);
  var hace21=new Date();hace21.setDate(hace21.getDate()-21);
  return d>=hace21;
}

function cargar(){
  // Cargar compras e historial en paralelo
  Promise.all([
    fetch(FIREBASE_URL+'/compras.json').then(function(r){return r.json();}).catch(function(){return null;}),
    fetch(FIREBASE_URL+'/historial.json').then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(results){
    dataCompras=results[0]||{};
    dataRevisiones=results[1]||{};
    cargado=true;
    renderVista();
  });
}

function cambiarVista(vista){
  vistaActual=vista;
  document.getElementById('tab-compras').className='tbar-btn'+(vista==='compras'?' on':'');
  document.getElementById('tab-revisiones').className='tbar-btn'+(vista==='revisiones'?' on':'');
  if(cargado)renderVista();
}

function renderVista(){
  var cont=document.getElementById('contenido');cont.innerHTML='';
  if(vistaActual==='compras')renderCompras(cont);
  else renderRevisiones(cont);
}

function renderCompras(cont){
  var entradas=Object.entries(dataCompras).filter(function(e){return e[1]&&e[1].fechaCompra&&esUltimas3Semanas(e[1].fechaCompra);});
  entradas.sort(function(a,b){return new Date(b[1].fechaCompra)-new Date(a[1].fechaCompra);});
  if(!entradas.length){
    cont.innerHTML='<div class="vacio"><h2>Sin compras</h2><p>No hay compras registradas en las últimas 3 semanas.</p></div>';return;
  }
  // Agrupar por semana
  var semanas={};
  entradas.forEach(function(e){
    var lbl=semanaLabel(e[1].fechaCompra);
    if(!semanas[lbl])semanas[lbl]=[];
    semanas[lbl].push(e[1]);
  });
  Object.entries(semanas).forEach(function(sw){
    var sem=document.createElement('div');sem.className='semana';
    var hdr=document.createElement('div');hdr.className='semana-header';
    hdr.innerHTML='<div><div class="semana-titulo">'+sw[0]+'</div><div class="semana-meta">'+sw[1].length+' compra'+(sw[1].length>1?'s':'')+'</div></div><span class="semana-chevron">▾</span>';
    var body=document.createElement('div');body.className='semana-body';
    hdr.onclick=function(){body.classList.toggle('hidden');hdr.classList.toggle('collapsed');};
    sw[1].forEach(function(compra){
      var card=document.createElement('div');card.className='compra-card';
      var chdr=document.createElement('div');chdr.className='compra-header';
      var nOk=compra.comprados?compra.comprados.length:0;
      var nNf=compra.noEncontrados?compra.noEncontrados.length:0;
      chdr.innerHTML='<div><div class="compra-fecha">'+formatFecha(compra.fechaCompra)+'</div><div class="ci-tienda">'+formatHora(compra.fechaCompra)+'</div></div><div class="compra-stats"><span class="stat ok">'+nOk+' comprados</span>'+(nNf>0?'<span class="stat nf">'+nNf+' no encontrados</span>':'')+'</div>';
      card.appendChild(chdr);
      if(nOk>0){
        var sec=document.createElement('div');sec.className='compra-sec';sec.textContent='Comprado';card.appendChild(sec);
        compra.comprados.forEach(function(it){
          var d=document.createElement('div');d.className='compra-item';
          d.innerHTML='<div><div class="ci-nombre">'+it.nombre+'</div>'+(it.tienda?'<div class="ci-tienda">'+it.tienda+'</div>':'')+'</div><span class="ci-badge ok">✓</span>';
          card.appendChild(d);
        });
      }
      if(nNf>0){
        var sec2=document.createElement('div');sec2.className='compra-sec';sec2.textContent='No encontrado';card.appendChild(sec2);
        compra.noEncontrados.forEach(function(it){
          var d=document.createElement('div');d.className='compra-item';
          d.innerHTML='<div><div class="ci-nombre">'+it.nombre+'</div>'+(it.tienda?'<div class="ci-tienda">'+it.tienda+'</div>':'')+'</div><span class="ci-badge nf">✕</span>';
          card.appendChild(d);
        });
      }
      if(compra.notas&&compra.notas.trim()){
        var notas=document.createElement('div');notas.className='compra-notas';
        notas.innerHTML='<strong>Notas del comprador</strong>'+compra.notas;
        card.appendChild(notas);
      }
      body.appendChild(card);
    });
    sem.appendChild(hdr);sem.appendChild(body);cont.appendChild(sem);
  });
}

function renderRevisiones(cont){
  var entradas=Object.entries(dataRevisiones).filter(function(e){return e[1]&&e[1].fecha&&esUltimas3Semanas(e[1].fecha);});
  entradas.sort(function(a,b){return new Date(b[1].fecha)-new Date(a[1].fecha);});
  if(!entradas.length){
    cont.innerHTML='<div class="vacio"><h2>Sin revisiones</h2><p>No hay revisiones registradas en las últimas 3 semanas.</p></div>';return;
  }
  var semanas={};
  entradas.forEach(function(e){
    var lbl=semanaLabel(e[1].fecha);
    if(!semanas[lbl])semanas[lbl]=[];
    semanas[lbl].push(e[1]);
  });
  Object.entries(semanas).forEach(function(sw){
    var sem=document.createElement('div');sem.className='semana';
    var hdr=document.createElement('div');hdr.className='semana-header';
    hdr.innerHTML='<div><div class="semana-titulo">'+sw[0]+'</div><div class="semana-meta">'+sw[1].length+' revisión'+(sw[1].length>1?'es':'')+'</div></div><span class="semana-chevron">▾</span>';
    var body=document.createElement('div');body.className='semana-body';
    hdr.onclick=function(){body.classList.toggle('hidden');hdr.classList.toggle('collapsed');};
    sw[1].forEach(function(rev){
      var card=document.createElement('div');card.className='compra-card';
      var chdr=document.createElement('div');chdr.className='compra-header';
      chdr.innerHTML='<div><div class="compra-fecha">'+formatFecha(rev.fecha)+'</div><div class="ci-tienda">'+rev.items.length+' artículos solicitados</div></div>';
      card.appendChild(chdr);
      // Agrupar por área
      var areas={};
      rev.items.forEach(function(it){if(!areas[it.area])areas[it.area]=[];areas[it.area].push(it);});
      Object.keys(areas).forEach(function(area){
        var sec=document.createElement('div');sec.className='lista-sec';sec.textContent=area;card.appendChild(sec);
        areas[area].forEach(function(it){
          var d=document.createElement('div');d.className='lista-item';
          var det='';
          if(it.tipo==='pieza'&&it.qty)det=' — '+it.qty+' pz';
          else if(it.tipo==='peso'&&it.cant)det=' — '+it.cant+(it.unidad?' '+it.unidad:'');
          d.innerHTML='<span>'+it.nombre+det+'</span>'+(it.tienda?'<span class="lista-det"> · '+it.tienda+'</span>':'');
          card.appendChild(d);
        });
      });
      if(rev.extras&&rev.extras.trim()){
        var notas=document.createElement('div');notas.className='compra-notas';
        notas.innerHTML='<strong>Notas</strong>'+rev.extras;
        card.appendChild(notas);
      }
      body.appendChild(card);
    });
    sem.appendChild(hdr);sem.appendChild(body);cont.appendChild(sem);
  });
}

cargar();
</script>
</body>
</html>
