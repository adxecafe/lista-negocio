});});});

// HEADER
document.getElementById('hdr-sub').textContent=DIAS[HOY.getDay()]+' '+HOY.getDate()+' de '+MESES[HOY.getMonth()];

function contarArea(aid){
  var a=AREAS.find(function(x){return x.id===aid;});
  var n=0;
  a.categorias.forEach(function(c){c.items.forEach(function(it){if(E[it.id].checked)n++;});});
  return n;
}

function renderTabs(){
  var cont=document.getElementById('tabs-areas');cont.innerHTML='';
  AREAS.forEach(function(a){
    var btn=document.createElement('button');
    btn.className='tab'+(a.id===areaActiva?' on':'');
    btn.id='tab-'+a.id;
    var n=contarArea(a.id);
    btn.innerHTML=a.nombre+'<span class="badge'+(n>0?' show':'')+'" id="badge-'+a.id+'">'+(n>0?n:'')+'</span>';
    btn.onclick=function(){cambiarArea(a.id);};
    cont.appendChild(btn);
  });
}

function cambiarArea(id){
  areaActiva=id;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  document.getElementById('tab-'+id).classList.add('on');
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});
  document.getElementById('panel-'+id).classList.add('on');
  window.scrollTo(0,0);
}

function actualizarBadges(){
  AREAS.forEach(function(a){
    var n=contarArea(a.id);
    var b=document.getElementById('badge-'+a.id);
    if(b){b.textContent=n>0?n:'';b.className='badge'+(n>0?' show':'');}
  });
}

function renderPaneles(){
  var cont=document.getElementById('paneles-areas');cont.innerHTML='';
  AREAS.forEach(function(a){
    var panel=document.createElement('div');
    panel.className='panel'+(a.id===areaActiva?' on':'');
    panel.id='panel-'+a.id;
    a.categorias.forEach(function(cat){
      var sec=document.createElement('div');sec.className='sec-label';sec.textContent=cat.nombre;panel.appendChild(sec);
      cat.items.forEach(function(it){
        var e=E[it.id];
        var div=document.createElement('div');div.className='item'+(e.checked?' done':'');div.id='item-'+it.id;
        var chk=document.createElement('div');chk.className='chk'+(e.checked?' on':'');chk.id='chk-'+it.id;
        chk.onclick=function(){toggleItem(it);};
        var info=document.createElement('div');info.className='iinfo';
        var nombre=document.createElement('div');nombre.className='iname';nombre.textContent=it.nombre;info.appendChild(nombre);
        if(it.pres){var p=document.createElement('div');p.className='ipres';p.textContent=it.pres;info.appendChild(p);}
        if(it.min){var m=document.createElement('div');m.className='imin';m.textContent='⚠ Mín: '+it.min;info.appendChild(m);}
        if(it.ant){var an=document.createElement('div');an.className='iant';an.textContent='🕐 '+it.ant;info.appendChild(an);}
        div.appendChild(chk);div.appendChild(info);
        if(it.tipo==='pieza'){
          var cnt=document.createElement('div');cnt.className='cnt';cnt.id='cnt-'+it.id;cnt.style.display=e.checked?'flex':'none';
          var bm=document.createElement('button');bm.className='cb';bm.textContent='−';
          bm.onclick=function(){E[it.id].qty=Math.max(1,E[it.id].qty-1);document.getElementById('cn-'+it.id).textContent=E[it.id].qty;};
          var cn=document.createElement('span');cn.className='cn';cn.id='cn-'+it.id;cn.textContent=e.qty;
          var bp=document.createElement('button');bp.className='cb';bp.textContent='+';
          bp.onclick=function(){E[it.id].qty++;document.getElementById('cn-'+it.id).textContent=E[it.id].qty;};
          cnt.appendChild(bm);cnt.appendChild(cn);cnt.appendChild(bp);div.appendChild(cnt);
        } else if(it.tipo==='peso'){
          var campo=document.createElement('div');campo.className='campo';campo.id='campo-'+it.id;campo.style.display=e.checked?'flex':'none';
          var inp=document.createElement('input');inp.type='number';inp.inputMode='decimal';inp.placeholder='0';inp.value=e.cant||'';
          inp.oninput=function(ev){E[it.id].cant=ev.target.value;};inp.onclick=function(ev){ev.stopPropagation();};
          var un=document.createElement('span');un.className='cunit';un.textContent=it.unidad||'';
          campo.appendChild(inp);campo.appendChild(un);div.appendChild(campo);
        }
        panel.appendChild(div);
      });
    });
    // Notas solo en pedidos
    if(a.id==='pedidos'){
      var wrap=document.createElement('div');wrap.className='extras-wrap';wrap.style.marginTop='8px';
      var lbl=document.createElement('label');lbl.textContent='Notas / artículos extra';
      var ta=document.createElement('textarea');ta.placeholder='Insumos de temporada, pruebas, notas para el comprador...';ta.value=extrasTexto;
      ta.oninput=function(ev){extrasTexto=ev.target.value;};
      wrap.appendChild(lbl);wrap.appendChild(ta);panel.appendChild(wrap);
    }
    cont.appendChild(panel);
  });
}

function toggleItem(it){
  E[it.id].checked=!E[it.id].checked;
  document.getElementById('item-'+it.id).classList.toggle('done',E[it.id].checked);
  document.getElementById('chk-'+it.id).classList.toggle('on',E[it.id].checked);
  if(it.tipo==='pieza'){var c=document.getElementById('cnt-'+it.id);if(c)c.style.display=E[it.id].checked?'flex':'none';}
  else if(it.tipo==='peso'){var c2=document.getElementById('campo-'+it.id);if(c2)c2.style.display=E[it.id].checked?'flex':'none';}
  actualizarBadges();
}

function limpiarActual(){
  var area=AREAS.find(function(a){return a.id===areaActiva;});
  if(!confirm('¿Limpiar selección de '+area.nombre+'?'))return;
  area.categorias.forEach(function(cat){cat.items.forEach(function(it){E[it.id].checked=false;E[it.id].qty=1;E[it.id].cant='';});});
  renderPaneles();renderTabs();
}

function irAResumen(){
  document.querySelectorAll('textarea').forEach(function(t){extrasTexto=t.value;});
  // Validar que cada área tenga al menos un artículo
  var areasVacias=[];
  AREAS.forEach(function(a){
    var n=0;
    a.categorias.forEach(function(c){c.items.forEach(function(it){if(E[it.id].checked)n++;});});
    if(n===0)areasVacias.push(a.nombre);
  });
  if(areasVacias.length>0){
    alert('Faltan artículos en:\n\n• '+areasVacias.join('\n• ')+'\n\nCada área debe tener al menos un artículo seleccionado.');
    return;
  }
  var total=0;
  AREAS.forEach(function(a){a.categorias.forEach(function(c){c.items.forEach(function(it){if(E[it.id].checked)total++;});});});

  // Construir lista de confirmados
  confirmados={};
  AREAS.forEach(function(a){
    var rows=[];
    a.categorias.forEach(function(cat){
      cat.items.filter(function(it){return E[it.id].checked;}).forEach(function(it){
        it.catNombre=cat.nombre;rows.push({it:it,quitado:false});
      });
    });
    if(rows.length)confirmados[a.id]=rows;
  });

  document.getElementById('res-sub').textContent=total+' artículo'+(total!==1?'s':'')+' seleccionado'+(total!==1?'s':'');
  renderResumen();
  document.getElementById('paso-seleccion').style.display='none';
  document.getElementById('paso-resumen').style.display='block';
  window.scrollTo(0,0);
}

function renderResumen(){
  var cont=document.getElementById('res-items');cont.innerHTML='';
  AREAS.forEach(function(a){
    var rows=confirmados[a.id];
    if(!rows||!rows.length)return;
    // título de área
    var atit=document.createElement('div');
    atit.style.cssText='font-size:13px;font-weight:600;color:#0f172a;padding:14px 16px 4px;background:#f8fafc;border-bottom:0.5px solid #e2e8f0;';
    atit.textContent=a.nombre;cont.appendChild(atit);
    // agrupar por categoria
    var cats={};
    rows.forEach(function(row){if(!cats[row.it.catNombre])cats[row.it.catNombre]=[];cats[row.it.catNombre].push(row);});
    Object.keys(cats).forEach(function(catNombre){
      var sec=document.createElement('div');sec.className='resumen-sec';sec.textContent=catNombre;cont.appendChild(sec);
      cats[catNombre].forEach(function(row){
        var div=document.createElement('div');div.className='resumen-item'+(row.quitado?' quitado':'');
        div.onclick=function(){
          row.quitado=!row.quitado;
          var total=0;
          AREAS.forEach(function(a2){(confirmados[a2.id]||[]).forEach(function(r){if(!r.quitado)total++;});});
          document.getElementById('res-sub').textContent=total+' artículo'+(total!==1?'s':'')+' confirmado'+(total!==1?'s':'');
          renderResumen();
        };
        var chk=document.createElement('div');chk.className='r-chk';
        var info=document.createElement('div');info.className='r-info';
        var nombre=document.createElement('div');nombre.className='r-nombre';nombre.textContent=row.it.nombre;info.appendChild(nombre);
        var det='';
        if(row.it.tipo==='pieza')det=E[row.it.id].qty+' pz';
        else if(row.it.tipo==='peso'&&E[row.it.id].cant)det=E[row.it.id].cant+(row.it.unidad?' '+row.it.unidad:'');
        if(det){var d=document.createElement('div');d.className='r-det';d.textContent=det;info.appendChild(d);}
        if(row.it.ant){var an=document.createElement('div');an.className='r-ant';an.textContent='🕐 '+row.it.ant;info.appendChild(an);}
        div.appendChild(chk);div.appendChild(info);cont.appendChild(div);
      });
    });
  });
  if(extrasTexto.trim()){
    var sec2=document.createElement('div');sec2.className='resumen-sec';sec2.textContent='Notas / extras';cont.appendChild(sec2);
    var p=document.createElement('div');p.style.cssText='padding:10px 16px;font-size:13px;white-space:pre-wrap;line-height:1.5;background:white;';p.textContent=extrasTexto;cont.appendChild(p);
  }
}

function volverSeleccion(){
  // Aplicar quitados al estado
  AREAS.forEach(function(a){
    (confirmados[a.id]||[]).forEach(function(row){
      if(row.quitado){E[row.it.id].checked=false;E[row.it.id].qty=1;E[row.it.id].cant='';}
    });
  });
  confirmados={};
  renderPaneles();renderTabs();
  document.getElementById('paso-resumen').style.display='none';
  document.getElementById('paso-seleccion').style.display='block';
  window.scrollTo(0,0);
}

function construirPayload(){
  var payload={fecha:HOY.toISOString(),items:[],extras:extrasTexto};
  AREAS.forEach(function(a){a.categorias.forEach(function(cat){cat.items.forEach(function(it){
    if(!E[it.id].checked)return;
    payload.items.push({
      area:a.nombre,categoria:cat.nombre,nombre:it.nombre,
      pres:it.pres||'',tienda:it.tienda||'',tipo:it.tipo,
      qty:it.tipo==='pieza'?E[it.id].qty:null,
      cant:it.tipo==='peso'?E[it.id].cant:null,
      unidad:it.unidad||null,ant:it.ant||null
    });
  });});});
  return payload;
}

function enviarLista(){
  var btn=document.getElementById('btn-enviar');
  btn.disabled=true;btn.textContent='Guardando...';
  var payload=construirPayload();
  var fechaKey=HOY.getFullYear()+'_'+(HOY.getMonth()+1)+'_'+HOY.getDate();
  fetch(FIREBASE_URL+'/lista.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){if(!r.ok)throw new Error('Error');
      return fetch(FIREBASE_URL+'/historial/'+fechaKey+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    })
    .then(function(){
      btn.disabled=false;
      document.getElementById('paso-resumen').style.display='none';
      document.getElementById('paso-enviado').style.display='block';
    })
    .catch(function(){
      btn.disabled=false;btn.textContent='Enviar lista ✓';
      alert('Error al guardar. Verifica tu conexión.');
    });
}

function nuevaLista(){
  Object.keys(E).forEach(function(k){E[k].checked=false;E[k].qty=1;E[k].cant='';});
  extrasTexto='';confirmados={};areaActiva='barra';
  document.getElementById('paso-enviado').style.display='none';
  document.getElementById('paso-seleccion').style.display='block';
  renderTabs();renderPaneles();window.scrollTo(0,0);
}

renderTabs();renderPaneles();
